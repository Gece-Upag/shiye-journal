<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(82px + env(safe-area-inset-bottom));overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 14px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:36px;height:36px;border-radius:13px;background:var(--accent);color:white;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 10px #51694f30}.brand-title{font-weight:750;letter-spacing:.4px;font-size:17px}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;cursor:pointer;transition:.15s}.icon-btn:hover,.btn:hover{transform:translateY(-1px)}.icon-btn:active,.btn:active{transform:scale(.98)}.head-actions{display:flex;gap:8px}.page-head{padding:8px 22px 16px;display:flex;justify-content:space-between;align-items:end;gap:12px}.eyebrow{text-transform:uppercase;color:var(--accent);font-size:10px;letter-spacing:1.8px;font-weight:800}.page-title{font-size:27px;letter-spacing:-.6px;line-height:1.2;font-weight:760;margin-top:5px}.page-sub{font-size:12px;color:var(--muted);margin-top:6px}.content{padding:0 16px 20px;display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:0 3px 15px rgba(34,42,31,.018)}.card-title{font-size:14px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:10px}.mute font-size:13px;font-weight:700;margin-bottom:5px}.entry-excerpt{font-size:12px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.entry-trailing{display:flex;flex-direction:column;align-items:end;gap:8px}.mini-action{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 5px;font-size:16px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty-icon{width:54px;height:54px;background:var(--surface2);border-radius:18px;display:grid;place-items:center;margin:0 auto 11px;font-size:24px}.empty strong{font-size:13px;color:var(--text);display:block;margin-bottom:5px}.fab{position:fixed;right:max(calc((100vw - 520px)/2 + 20px),20px);bottom:calc(94px + env(safe-area-inset-bottom));z-index:4;min-width:54px;height:54px;padding:0 19px;border-radius:18px;background:var(--accent);color:white;border:0;box-shadow:0 9px 24px #334e3030;font-size:14px;font-weight:750;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:8}.nav-item{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;font-family:inherit;cursor:pointer;font-size:10px;font-weight:650}.nav-icon{width:34px;height:26px;border-radius:10px;display:grid;place-items:center;font-size:18px}.nav-item.active{color:var(--accent-strong)}.nav-item.active .nav-icon{background:var(--accent-soft)}.segmented{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:13px}.segmented button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer}.segmented button.active{background:var(--surface);box-shadow:0 2px 5px #00000008;color:var(--text);font-weight:750}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;outline:none;min-width:0}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.textarea{resize:vertical;min-height:115px;line-height:1.65}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:var(--text)}.field .hint{font-size:11px;color:var(--muted)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px 10px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}.stat-label{font-size:10px;color:var(--muted);margin-bottom:8px}.stat-value{font-size:17px;font-weight:780;letter-spacing:-.4px;white-space:nowrap}.stat-value.green{color:var(--accent)}.stat-value.red{color:var(--danger)}.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:99px}.line-item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.line-item:last-child{border-bottom:0;padding-bottom:0}.avatar{width:40px;height:40px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex-shrink:0}.line-body{flex:1;min-width:0}.line-title{font-size:13px;font-weight:700}.line-sub{font-size:11px;color:var(--muted);margin-top:4px}.amount{font-size:14px;font-weight:800;white-space:nowrap}.amount.income{color:var(--accent)}.amount.expense{color:var(--danger)}.amount.borrow{color:#a77528}.bubble{max-width:86%;border:1px solid var(--line);background:var(--surface);border-radius:5px 18px 18px 18px;padding:12px 13px;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.bubble.own{background:var(--accent-soft);border-color:#dce7d6;border-radius:18px 5px 18px 18px}.chat-row{display:flex;gap:8px;align-items:flex-start}.chat-row.ownrow{justify-content:flex-end}.chat-time{font-size:10px;color:var(--muted);margin-top:5px}.chat-menu{display:flex;gap:8px;margin-top:4px}.chat-input{display:flex;gap:8px;align-items:end}.chat-input .input{border-radius:16px;min-height:46px}.template-field{border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;gap:8px;align-items:center}.template-field .field-name{flex:1;font-size:13px;font-weight:650}.switch{width:42px;height:25px;background:#d3d4ce;border:0;border-radius:99px;padding:3px;cursor:pointer;transition:.15s}.switch::after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:.15s}.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(17px)}.section-label{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.5px;text-transform:uppercase;margin:4px 2px -4px}.setting-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0;padding-bottom:0}.setting-ico{width:38px;height:38px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:17px;flex-shrink:0}.setting-main{flex:1;min-width:0}.setting-main strong{display:block;font-size:13px}.setting-main span{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}.back-row{display:flex;align-items:center;gap:10px;padding:4px 0 12px}.back-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:36px;height:36px;cursor:pointer;color:var(--text)}.highlight{background:#f7df9a;color:#4c3a0c;border-radius:3px;padding:0 1px}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#202a1f;color:white;padding:11px 15px;border-radius:13px;box-shadow:var(--shadow);font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#1c241d65;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}.modal{width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:21px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;box-shadow:0 -16px 50px #0002;animation:rise .2s ease-out}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-title{font-size:18px;font-weight:800}.modal-close{width:32px;height:32px;border:0;background:var(--surface2);border-radius:10px;cursor:pointer;font-size:17px;color:var(--text)}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions>*{flex:1}@keyframes rise{from{transform:translateY(20px);opacity:.75}to{transform:translateY(0);opacity:1}}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.result-panel h4{font-size:11px;color:var(--muted);margin:0 0 10px}.result-panel p{font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.badge-dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:5px}.footer-note{text-align:center;color:var(--muted);font-size:10px;padding:10px 0 2px}.desktop-note{display:none}
body.dark{--bg:#171a17;--surface:#212621;--surface2:#2b302b;--text:#eff1e9;--muted:#a1a99c;--line:#343a33;--accent:#abc39c;--accent-soft:#303d2e;--accent-strong:#d9e9ce;--danger:#f09589;--danger-soft:#452c29;--gold:#d1ad6f;--shadow:0 12px 36px rgba(0,0,0,.2)}body.dark .brand-mark{color:#172016}body.dark .highlight{background:#725c22;color:#fff2c2}body.dark .btn{color:#182117}body.dark .btn.secondary,body.dark .btn.ghost,body.dark .btn.danger{color:var(--text)}body.dark .fab{color:#172016}
@media(min-width:600px){body{align-items:flex-start;padding:22px 0}.app{min-height:calc(100dvh - 44px);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px #202b1b16}.topbar{border-radius:28px 28px 0 0}.bottom-nav{bottom:22px;border-radius:0 0 28px 28px}.fab{position:absolute}.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:24px;max-height:85dvh}.desktop-note{display:block;position:fixed;left:calc(50% + 285px);top:45px;width:180px;color:#7a8075;font-size:11px;line-height:1.7}}
@media(max-width:360px){.content{padding-left:12px;padding-right:12px}.page-head{padding-left:18px;padding-right:18px}.topbar{padding-left:18px;padding-right:18px}.stat-value{font-size:14px}.field-grid{grid-template-columns:1fr}.date-num{font-size:34px}}

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✳</div><div><div class="brand-title">拾页</div><div class="brand-sub">写给自己的小小空间</div></div></div>
    <div class="head-actions" id="headerActions"><button class="icon-btn" title="搜索" onclick="openSearch()">⌕</button><button class="icon-btn" title="快速新增" onclick="quickAdd()">＋</button></div>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" data-tab="diary" onclick="switchTab('diary')"><span class="nav-icon">▤</span><span>日记</span></button>
    <button class="nav-item" data-tab="finance" onclick="switchTab('finance')"><span class="nav-icon">◫</span><span>记账</span></button>
    <button class="nav-item" data-tab="inspiration" onclick="switchTab('inspiration')"><span class="nav-icon">✳</span><span>灵感</span></button>
    <button class="nav-item" data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙</span><span>设置</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const nowISO=()=>new Date().toISOString(); const shiftISO=(days)=>{const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const fmtDate=(s)=>{if(!s)return '';const [y,m,d]=s.split('-');return `${y}年${Number(m)}月${Number(d)}日`}; const md=(s)=>s?`${s.slice(5,7)}-${s.slice(8,10)}`:'';
const money=n=>'¥'+(Number(n||0)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultTemplates=[{id:'tpl-daily',name:'日常',version:1,isDefault:true,fields:[{id:'mood',label:'心情',type:'single',required:false},{id:'body',label:'正文',type:'multi',required:true},{id:'note',label:'备注',type:'multi',required:false}]},{id:'tpl-review',name:'每日复盘',version:1,isDefault:false,fields:[{id:'good',label:'今天做得好的事',type:'multi',required:false},{id:'learn',label:'今天学到什么',type:'multi',required:false},{id:'next',label:'明天要做的事',type:'multi',required:true}]}];
const seed=()=>{const y=shiftISO(-1),p=shiftISO(-3),t=todayISO(),at=(date,time='20:00')=>`${date}T${time}:00`;return {templates:JSON.parse(JSON.stringify(defaultTemplates)),diaries:[{id:'demo-d1',date:y,templateId:'tpl-daily',templateName:'日常',templateVersion:1,fields:[{id:'mood',label:'心情',type:'single',required:false,content:'平静，带一点期待'},{id:'body',label:'正文',type:'multi',required:true,content:'今天慢慢把手头的事情做完了。傍晚走了一段路，发现熟悉的街道在日落时也有不一样的样子。想把这种不着急的感觉记下来。'},{id:'note',label:'备注',type:'multi',required:false,content:'晚上早点休息。'}],status:'complete',createdAt:at(y),updatedAt:at(y)},{id:'demo-d2',date:p,templateId:'tpl-review',templateName:'每日复盘',templateVersion:1,fields:[{id:'good',label:'今天做得好的事',type:'multi',required:false,content:'完成了一个一直拖着的小任务。'},{id:'learn',label:'今天学到什么',type:'multi',required:false,content:'先做一个很小的开始，比一直计划更有用。'},{id:'next',label:'明天要做的事',type:'multi',required:true,content:'早上先处理最重要的一件事。'}],status:'complete',createdAt:at(p),updatedAt:at(p)}],transactions:[{id:'demo-t1',type:'income',amount:680000,note:'本月收入',categoryId:'c-salary',accountId:'a-cash',dateTime:`${t}T09:00`,createdAt:nowISO(),updatedAt:nowISO()},{id:'demo-t2',type:'expense',amount:2600,note:'咖啡与早餐',categoryId:'c-food',accountId:'a-cash',dateTime:`${t}T08:30`,createdAt:nowISO(),updatedAt:nowISO()},{id:'demo-t3',type:'expense',amount:4800,note:'午餐',categoryId:'c-food',accountId:'a-cash',dateTime:`${t}T12:20`,createdAt:nowISO(),updatedAt:nowISO()},{id:'demo-t4',type:'expense',amount:1200,note:'公交出行',categoryId:'c-transport',accountId:'a-cash',dateTime:`${y}T18:10`,createdAt:nowISO(),updatedAt:nowISO()},{id:'demo-b1',type:'borrow',amount:10000,person:'A',note:'临时周转',dateTime:`${y}T12:00`,dueDate:shiftISO(6),status:'pending',createdAt:nowISO(),updatedAt:nowISO()},{id:'demo-b2',type:'lend',amount:2000,person:'B',note:'午餐先垫付',dateTime:`${p}T12:00`,dueDate:shiftISO(2),status:'pending',createdAt:nowISO(),updatedAt:nowISO()}],categories:[{id:'c-food',name:'餐饮',type:'expense',icon:'☕',active:true},{id:'c-life',name:'日用',type:'expense',icon:'⌂',active:true},{id:'c-transport',name:'交通',type:'expense',icon:'↗',active:true},{id:'c-salary',name:'工资',type:'income',icon:'＋',active:true},{id:'c-other',name:'其他',type:'income',icon:'◇',active:true}],accounts:[{id:'a-cash',name:'日常账户',opening:0,active:true}],debts:[],inspirations:[{id:'demo-i1',content:'也许可以给每周留一个没有安排的晚上。',createdAt:at(t,'18:45'),updatedAt:at(t,'18:45')},{id:'demo-i2',content:'把日记模板做得再简单一点，打开就能写，不要先思考怎么组织。',createdAt:at(y,'21:10'),updatedAt:at(y,'21:10')},{id:'demo-i3',content:'下次散步的时候带上耳机，听那张还没听完的专辑。',createdAt:at(p,'17:32'),updatedAt:at(p,'17:32')}],settings:{theme:'system',aiMode:'off',aiProvider:'OpenAI 兼容接口',baseUrl:'',model:'',apiKey:'',timeout:30,lastBackup:null},schemaVersion:1}};
let data;try{data=JSON.parse(localStorage.getItem('shiye_data_v1'))||seed()}catch(e){data=seed()};
// Merge defaults for forward-compatible browser prototype data.
const defaults=seed();for(const k in defaults)if(data[k]===undefined)data[k]=defaults[k];if(!Array.isArray(data.templates)||!data.templates.length)data.templates=defaultTemplates;
let state={tab:'diary',page:'home',returnPage:'home',activeDiary:null,search:{q:'',from:'',to:'',sort:'desc'},financePeriod:'month',financeType:'expense',inspirationQuery:'',inspirationFrom:'',inspirationTo:'',inspirationSort:'desc',editingTransaction:null,editingInspiration:null,editingTemplate:null,aiDraft:null};
function persist(){try{localStorage.setItem('shiye_data_v1',JSON.stringify(data))}catch(e){toast('本地存储空间不足，数据未能完整保存')}}
function id(prefix='id'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function currentTemplate(){return data.templates.find(t=>t.isDefault)||data.templates[0]}
function diaryByDate(date){return data.diaries.find(d=>d.date===date&&!d.deleted)}
function diaryExcerpt(d){if(!d)return '';return (d.fields||[]).map(f=>f.content||'').filter(Boolean).join(' · ').slice(0,150)}
function pageHead(kicker,title,sub='',right=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><div class="page-title">${title}</div>${sub?`<div class="page-sub">${sub}</div>`:''}</div>${right}</div>`}
function setTabUI(){ $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab)); }
function switchTab(tab){state.tab=tab;state.page='home';state.activeDiary=null;state.editingTransaction=null;state.editingInspiration=null;setTabUI();render();}
function navigate(page){state.page=page;render()}
function quickAdd(){if(state.tab==='diary')openToday();else if(state.tab==='finance')openTransactionForm();else if(state.tab==='inspiration')$('#inspirationInput')?.focus();else openBackupModal()}
function openToday(){const date=todayISO();let d=diaryByDate(date);if(!d){d=createDiary(date)}state.activeDiary=d.id;state.page='editor';render()}
function createDiary(date){const exists=diaryByDate(date);if(exists)return exists;const t=currentTemplate();const d={id:id('diary'),date,templateId:t.id,templateName:t.name,templateVersion:t.version,fields:t.fields.map(f=>({...f,content:''})),status:'draft',createdAt:nowISO(),updatedAt:nowISO()};data.diaries.push(d);persist();return d}
function openDiary(idv){state.activeDiary=idv;state.page='editor';render()}
function updateDiaryField(did,fid,value){const d=data.diaries.find(x=>x.id===did);if(!d)return;const f=d.fields.find(x=>x.id===fid);if(!f)return;f.content=value;d.updatedAt=nowISO();d.status='draft';persist();const status=$('#saveStatus');if(status)status.innerHTML='<span class="badge-dot"></span>保存中';clearTimeout(window.__saveTimers?.[did]);if(!window.__saveTimers)window.__saveTimers={};window.__saveTimers[did]=setTimeout(()=>{const live=data.diaries.find(x=>x.id===did);if(live){live.updatedAt=nowISO();persist();const el=$('#saveStatus');if(el&&state.activeDiary===did)el.innerHTML='<span class="badge-dot"></span>已保存';}},800)}
function editorBack(){const d=data.diaries.find(x=>x.id===state.activeDiary);if(d){d.updatedAt=nowISO();persist()}state.activeDiary=null;state.page='home';render()}
function deleteDiary(idv){confirmModal('永久删除日记？','删除后，这篇日记将从本机数据库中永久移除，无法撤销，也不会进入备份。',()=>{clearTimeout(window.__saveTimers?.[idv]);data.diaries=data.diaries.filter(d=>d.id!==idv);persist();if(state.activeDiary===idv){state.activeDiary=null;state.page='home'}render();toast('日记已永久删除')},'永久删除')}
function switchTemplate(did,tid){const d=data.diaries.find(x=>x.id===did),t=data.templates.find(x=>x.id===tid);if(!d||!t)return;const old=d.fields;const next=t.fields.map(tf=>{const match=old.find(of=>of.id===tf.id)||old.find(of=>of.label===tf.label);return {...tf,content:match?.content||''}});const unmapped=old.filter(of=>!next.some(nf=>nf.id===of.id)&&of.content);if(unmapped.length){confirmModal('切换模板','有 '+unmapped.length+' 个旧字段无法对应。为防止内容丢失，原字段将保留在日记中。',()=>{d.fields=[...next,...unmapped.map(f=>({...f,legacy:true}))];d.templateId=t.id;d.templateName=t.name;d.templateVersion=t.version;persist();render();toast('模板已切换，原有内容已保留')},'保留内容并切换');return}d.fields=next;d.templateId=t.id;d.templateName=t.name;d.templateVersion=t.version;persist();render();toast('模板已切换')}
function render(){setTabUI();$('#headerActions').innerHTML=state.page==='editor'?`<button class="icon-btn" title="返回" onclick="editorBack()">‹</button><button class="icon-btn" title="模板" onclick="openTemplatePicker()">▦</button><button class="icon-btn" title="更多" onclick="openDiaryMenu()">···</button>`:state.page==='home'&&state.tab==='settings'?`<button class="icon-btn" title="帮助" onclick="showAbout()">ⓘ</button>`:state.page==='home'&&state.tab==='inspiration'?`<button class="icon-btn" title="搜索灵感" onclick="openInspirationSearch()">⌕</button>`:state.page==='home'&&state.tab==='finance'?`<button class="icon-btn" title="统计" onclick="navigate('stats')">▥</button><button class="icon-btn" title="添加流水" onclick="openTransactionForm()">＋</button>`:state.page==='home'&&state.tab==='diary'?`<button class="icon-btn" title="搜索日记" onclick="openSearch()">⌕</button><button class="icon-btn" title="模板管理" onclick="navigate('templates')">▦</button>`:`<button class="icon-btn" title="返回" onclick="goBack()">‹</button>`;
 const main=$('#main');if(state.tab==='diary'){if(state.page==='editor')main.innerHTML=renderEditor();else if(state.page==='search')main.innerHTML=renderDiarySearch();else if(state.page==='templates')main.innerHTML=renderTemplates();else if(state.page==='templateEditor')main.innerHTML=renderTemplateEditor();else main.innerHTML=renderDiaryHome()}else if(state.tab==='finance'){if(state.page==='transactionEditor')main.innerHTML=renderTransactionEditor();else if(state.page==='stats')main.innerHTML=renderStats();else if(state.page==='categories')main.innerHTML=renderCategories();else if(state.page==='accounts')main.innerHTML=renderAccounts();else if(state.page==='debts')main.innerHTML=renderDebts();else main.innerHTML=renderFinanceHome()}else if(state.tab==='inspiration'){if(state.page==='search')main.innerHTML=renderInspirationSearch();else main.innerHTML=renderInspirationHome()}else{if(state.page==='ai')main.innerHTML=renderAISettings();else main.innerHTML=renderSettings()}attachDynamicHandlers();}
function goBack(){if(state.page==='editor'){editorBack();return}if(state.page==='transactionEditor'){state.page='home';state.editingTransaction=null;render();return}if(state.page==='templateEditor'){state.page='templates';state.editingTemplate=null;render();return}if(state.page==='search'||state.page==='templates'||state.page==='stats'||state.page==='categories'||state.page==='accounts'||state.page==='debts'||state.page==='ai'){state.page='home';render();return}switchTab('diary')}
function renderDiaryHome(){const t=todayISO(),d=diaryByDate(t),days=['周日','周一','周二','周三','周四','周五','周六'];const date=new Date();const diaries=[...data.diaries].filter(x=>!x.deleted).sort((a,b)=>b.date.localeCompare(a.date));return `${pageHead('YOUR PRIVATE PAGES','日记',`${date.getFullYear()} 年 · 把生活写下来`)}<div class="content"><section class="card"><div class="date-hero"><div><div class="date-month">${date.getFullYear()} / ${String(date.getMonth()+1).padStart(2,'0')}　${days[date.getDay()]}</div><div class="date-num">${String(date.getDate()).padStart(2,'0')}<span style="font-size:17px;letter-spacing:0;margin-left:5px;font-weight:600">日</span></div></div><div style="text-align:right"><span class="pill"><span class="mood-dot"></span>${d?'今天已记录':'留一页给今天'}</span><div class="tiny muted" style="margin-top:9px">${d?`最后编辑 ${new Date(d.updatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`:'不必写得完整，真实就好'}</div></div></div><div class="divider"></div><button class="btn block" onclick="openToday()">${d?'继续写今天':'✦ 写下今天'}</button></section><div class="row between"><div class="card-title">过往日记 <span class="pill gray">${diaries.length} 篇</span></div><button class="link-btn" onclick="openSearch()">搜索全部 ↗</button></div><section class="card" style="padding-top:5px">${diaries.length?diaries.slice(0,30).map(d=>`<div class="entry-card" onclick="openDiary('${d.id}')"><div class="entry-date"><strong>${d.date.slice(-2)}</strong><span>${d.date.slice(5,7)} 月</span></div><div class="entry-main"><div class="entry-title">${escapeHTML(d.templateName||'日记')}${d.status==='draft'?'<span class="pill gray" style="margin-left:7px;padding:3px 6px">草稿</span>':''}</div><div class="entry-excerpt">${escapeHTML(diaryExcerpt(d)||'这一页还空着，点开继续写……')}</div></div><button class="mini-action" onclick="event.stopPropagation();deleteDiary('${d.id}')" title="删除">···</button></div>`).join(''):`<div class="empty"><div class="empty-icon">▤</div><strong>这里还很安静</strong><span class="small">写下第一篇日记，给这一天留个记号。</span><div style="margin-top:14px"><button class="btn secondary" onclick="openToday()">开始记录</button></div></div>`}</section><div class="footer-note">你的内容保存在当前设备的浏览器中 · 这是可编辑的示例数据；原生 App 版本将使用 Room</div></div><button class="fab" onclick="openToday()">＋ 今天</button>`}
function renderEditor(){const d=data.diaries.find(x=>x.id===state.activeDiary);if(!d)return '<div class="content">日记不存在。<button class="btn" onclick="editorBack()">返回</button></div>';return `<div class="page-head" style="padding-top:3px"><div><div class="eyebrow">DAILY NOTE</div><div class="page-title" style="font-size:24px">${fmtDate(d.date)}</div><div class="page-sub">${escapeHTML(d.templateName||'日记')} · 日期创建后不可修改</div></div><div class="pill" id="saveStatus"><span class="badge-dot"></span>已保存</div></div><div class="content"><div class="card"><div class="row between"><div class="card-title">今天想记些什么？</div><button class="link-btn" onclick="openTemplatePicker()">切换模板</button></div><div class="divider"></div><div class="stack">${d.fields.map(f=>`<div class="field"><label for="field-${escapeHTML(f.id)}">${escapeHTML(f.label)}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>${f.type==='single'?`<input id="field-${escapeHTML(f.id)}" class="input diary-field" data-fid="${escapeHTML(f.id)}" value="${escapeHTML(f.content)}" placeholder="${escapeHTML(f.label)}" />`:`<textarea id="field-${escapeHTML(f.id)}" class="textarea diary-field" data-fid="${escapeHTML(f.id)}" placeholder="${escapeHTML(f.label)} · 随心写下">${escapeHTML(f.content)}</textarea>`}${f.legacy?'<div class="hint">这是切换模板时保留的旧字段。</div>':''}</div>`).join('')}</div><div class="divider"></div><div class="row between"><span class="tiny muted">自动保存 · 停止输入后约 0.8 秒</span><button class="btn secondary smallbtn" onclick="completeDiary('${d.id}')">标记完成</button></div></div><section class="card"><div class="card-title">AI 辅助 <span class="pill gray">V2 · 可选</span></div><p class="small muted" style="line-height:1.7">AI 默认关闭。演示原型中会用示例结果模拟，不会将你的日记发送到任何 AI 服务。</p><div class="row wrap"><button class="btn secondary" onclick="runAI('polish','${d.id}')">✧ 润色日记</button><button class="btn ghost" onclick="runAI('summary','${d.id}')">总结一天</button></div></section><button class="btn ghost block" onclick="exportOneDiary('${d.id}')">导出这篇 Markdown</button></div>`}
function completeDiary(did){const d=data.diaries.find(x=>x.id===did);if(!d)return;const empty=d.fields.filter(f=>f.required&&!String(f.content||'').trim());if(empty.length){toast('请填写必填字段：'+empty.map(x=>x.label).join('、'));return}d.status='complete';d.updatedAt=nowISO();persist();toast('这篇日记已标记完成');render()}
function openDiaryMenu(){const d=data.diaries.find(x=>x.id===state.activeDiary);if(!d)return;openModal('日记操作',`<div class="stack"><button class="btn secondary block" onclick="closeModal();openTemplatePicker()">切换模板</button><button class="btn ghost block" onclick="closeModal();exportOneDiary('${d.id}')">导出 Markdown</button><button class="btn danger block" onclick="closeModal();deleteDiary('${d.id}')">永久删除日记</button></div>`)}
function openTemplatePicker(){const d=data.diaries.find(x=>x.id===state.activeDiary);if(!d)return;openModal('切换模板',`<div class="stack">${data.templates.map(t=>`<button class="template-field" style="text-align:left;background:var(--surface);cursor:pointer" onclick="closeModal();switchTemplate('${d.id}','${t.id}')"><span style="font-size:20px">▦</span><span class="field-name">${escapeHTML(t.name)}<span class="tiny muted" style="display:block;margin-top:3px">${t.fields.length} 个字段${t.isDefault?' · 默认':''}</span></span>${t.id===d.templateId?'✓':'›'}</button>`).join('')}<button class="btn ghost block" onclick="closeModal();navigate('templates')">管理模板</button></div>`)}
function openSearch(){if(state.tab!=='diary')state.tab='diary';state.page='search';render()}
function renderDiarySearch(){const s=state.search;const q=s.q.trim().toLocaleLowerCase();let list=data.diaries.filter(d=>{if(s.from&&d.date<s.from)return false;if(s.to&&d.date>s.to)return false;if(q){const all=[d.date,d.templateName,...d.fields.flatMap(f=>[f.label,f.content])].join('\n').toLocaleLowerCase();if(!all.includes(q))return false}return true}).sort((a,b)=>s.sort==='desc'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));return `${pageHead('FIND A MEMORY','搜索日记','按关键词或日期范围查找')}<div class="content"><section class="card"><div class="field"><label>关键词</label><input class="input" value="${escapeHTML(s.q)}" placeholder="搜索正文、字段标签……" oninput="state.search.q=this.value;renderSearchResults()" /></div><div class="field-grid" style="margin-top:12px"><div class="field"><label>开始日期</label><input class="input" type="date" value="${escapeHTML(s.from)}" onchange="state.search.from=this.value;renderSearchResults()" /></div><div class="field"><label>结束日期</label><input class="input" type="date" value="${escapeHTML(s.to)}" onchange="state.search.to=this.value;renderSearchResults()" /></div></div><div class="row between" style="margin-top:12px"><button class="link-btn" onclick="state.search={q:'',from:'',to:'',sort:state.search.sort};render()">清空条件</button><select class="select" style="width:auto;padding:8px 10px" onchange="state.search.sort=this.value;renderSearchResults()"><option value="desc" ${s.sort==='desc'?'selected':''}>日期从新到旧</option><option value="asc" ${s.sort==='asc'?'selected':''}>日期从旧到新</option></select></div></section><section class="card" id="searchResults">${searchResultsHTML(list,s.q)}</section></div>`}
function searchResultsHTML(list,q){if(!list.length)return '<div class="empty"><div class="empty-icon">⌕</div><strong>无结果</strong><span class="small">试试其他关键词或日期范围。</span></div>';const needle=(q||'').trim();return `<div class="card-title">搜索结果 <span class="pill gray">${list.length}</span></div>${list.map(d=>{let excerpt=diaryExcerpt(d)||'空白日记';if(needle){const idx=excerpt.toLocaleLowerCase().indexOf(needle.toLocaleLowerCase());if(idx>=0)excerpt=escapeHTML(excerpt.slice(0,idx))+`<mark class="highlight">${escapeHTML(excerpt.slice(idx,idx+needle.length))}</mark>`+escapeHTML(excerpt.slice(idx+needle.length));else excerpt=escapeHTML(excerpt)}else excerpt=escapeHTML(excerpt);return `<div class="entry-card" onclick="openDiary('${d.id}')"><div class="entry-date"><strong>${d.date.slice(-2)}</strong><span>${d.date.slice(5,7)} 月</span></div><div class="entry-main"><div class="entry-title">${escapeHTML(d.templateName)}</div><div class="entry-excerpt">${excerpt}</div></div><span class="muted">›</span></div>`}).join('')}`}
function renderSearchResults(){const root=$('#searchResults');if(!root)return;const s=state.search,q=s.q.trim().toLocaleLowerCase();const list=data.diaries.filter(d=>(!s.from||d.date>=s.from)&&(!s.to||d.date<=s.to)&&(!q||[d.date,d.templateName,...d.fields.flatMap(f=>[f.label,f.content])].join('\n').toLocaleLowerCase().includes(q))).sort((a,b)=>s.sort==='desc'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));root.innerHTML=searchResultsHTML(list,s.q)}
function renderTemplates(){return `${pageHead('MAKE IT YOURS','日记模板','每个模板都可以有自己的结构',`<button class="btn smallbtn" onclick="newTemplate()">＋ 新建</button>`)}<div class="content"><div class="card"><div class="card-title">我的模板 <span class="pill gray">${data.templates.length} 个</span></div><div class="divider"></div>${data.templates.map(t=>`<div class="line-item"><div class="avatar">▦</div><div class="line-body"><div class="line-title">${escapeHTML(t.name)} ${t.isDefault?'<span class="pill">默认</span>':''}</div><div class="line-sub">${t.fields.length} 个字段 · v${t.version}</div></div><button class="btn ghost smallbtn" onclick="editTemplate('${t.id}')">编辑</button><button class="mini-action" onclick="templateActions('${t.id}')">···</button></div>`).join('')}</div><div class="card"><div class="card-title">模板规则</div><p class="small muted" style="line-height:1.8;margin-bottom:0">修改模板不会改变旧日记。每篇日记会保存自己的字段快照。至少需要一个字段，并且至少包含一个多行字段。</p></div><button class="btn ghost block" onclick="goBack()">返回日记</button></div>`}
function newTemplate(){state.editingTemplate=null;state.page='templateEditor';render()}
function editTemplate(tid){state.editingTemplate=tid;state.page='templateEditor';render()}
function renderTemplateEditor(){const t=data.templates.find(x=>x.id===state.editingTemplate);const blank={name:'',fields:[{id:id('field'),label:'正文',type:'multi',required:true}]};const model=t||blank;return `${pageHead('TEMPLATE STUDIO',t?'编辑模板':'新建模板','字段将用于新建日记')}<div class="content"><section class="card"><div class="field"><label>模板名称</label><input class="input" id="tplName" value="${escapeHTML(model.name)}" placeholder="例如：旅行、每日复盘" /></div><div class="divider"></div><div class="card-title">字段 <span class="pill gray" id="fieldCount">${model.fields.length} 个</span></div><div class="stack" id="tplFields" style="margin-top:12px">${model.fields.map(templateFieldHTML).join('')}</div><button class="btn secondary block" style="margin-top:12px" onclick="addTemplateField()">＋ 添加字段</button></section><button class="btn block" onclick="saveTemplate()">保存模板</button><button class="btn ghost block" onclick="state.page='templates';render()">取消</button></div>`}
function templateFieldHTML(f,i){return `<div class="template-field" data-field-row="${escapeHTML(f.id)}"><div class="stack" style="flex:1;gap:7px"><input class="input tpl-label" data-id="${escapeHTML(f.id)}" value="${escapeHTML(f.label)}" placeholder="字段标签" /><div class="row wrap"><select class="select tpl-type" data-id="${escapeHTML(f.id)}" style="flex:1;padding:8px"><option value="single" ${f.type==='single'?'selected':''}>单行文本</option><option value="multi" ${f.type==='multi'?'selected':''}>多行文本</option></select><label class="small muted row"><input class="tpl-required" data-id="${escapeHTML(f.id)}" type="checkbox" ${f.required?'checked':''}/> 必填</label></div></div><div class="stack"><button class="mini-action" onclick="moveTemplateField('${f.id}',-1)" title="上移">↑</button><button class="mini-action" onclick="moveTemplateField('${f.id}',1)" title="下移">↓</button><button class="mini-action" onclick="removeTemplateField('${f.id}')" title="删除">×</button></div></div>`}
function readTemplateForm(){const t=data.templates.find(x=>x.id===state.editingTemplate);const fields=$$('.tpl-label').map(el=>{const fid=el.dataset.id;return{id:fid,label:el.value.trim(),type:$(`.tpl-type[data-id="${CSS.escape(fid)}"]`)?.value||'multi',required:$(`.tpl-required[data-id="${CSS.escape(fid)}"]`)?.checked||false}});return{id:t?.id||id('tpl'),name:$('#tplName')?.value.trim()||'',version:t?(t.version+1):1,isDefault:t?.isDefault||false,fields}}
function saveTemplate(){const m=readTemplateForm();if(!m.name){toast('请填写模板名称');return}if(!m.fields.length){toast('至少需要一个字段');return}if(m.fields.some(f=>!f.label)){toast('请填写所有字段标签');return}if(!m.fields.some(f=>f.type==='multi')){toast('至少需要一个多行字段');return}if(data.templates.some(t=>t.name===m.name&&t.id!==m.id)){toast('模板名称不能重复');return}if(m.isDefault===false&&!data.templates.some(t=>t.isDefault)){m.isDefault=true}const idx=data.templates.findIndex(t=>t.id===m.id);if(idx>=0)data.templates[idx]=m;else data.templates.push(m);persist();state.page='templates';state.editingTemplate=null;render();toast('模板已保存')}
function addTemplateField(){const root=$('#tplFields');if(!root)return;const newId=id('field');root.insertAdjacentHTML('beforeend',templateFieldHTML({id:newId,label:'',type:'multi',required:false}));$('#fieldCount').textContent=$$('.tpl-label').length+' 个'}
function removeTemplateField(fid){const rows=$$('[data-field-row]');if(rows.length<=1){toast('模板至少保留一个字段');return}const r=document.querySelector(`[data-field-row="${CSS.escape(fid)}"]`);r?.remove();$('#fieldCount').textContent=$$('.tpl-label').length+' 个'}
function moveTemplateField(fid,delta){const root=$('#tplFields'),row=document.querySelector(`[data-field-row="${CSS.escape(fid)}"]`);if(!root||!row)return;if(delta<0&&row.previousElementSibling)root.insertBefore(row,row.previousElementSibling);else if(delta>0&&row.nextElementSibling)root.insertBefore(row.nextElementSibling,row);}
function templateActions(tid){const t=data.templates.find(x=>x.id===tid);if(!t)return;openModal('模板操作',`<div class="stack"><button class="btn secondary block" onclick="closeModal();editTemplate('${tid}')">编辑模板</button>${!t.isDefault?`<button class="btn ghost block" onclick="setDefaultTemplate('${tid}')">设为默认模板</button>`:''}${data.templates.length>1?`<button class="btn danger block" onclick="closeModal();deleteTemplate('${tid}')">删除模板</button>`:''}</div>`)}
function setDefaultTemplate(tid){data.templates.forEach(t=>t.isDefault=t.id===tid);persist();closeModal();render();toast('默认模板已更新')}
function deleteTemplate(tid){const t=data.templates.find(x=>x.id===tid);if(!t)return;if(data.templates.length<=1){toast('至少保留一个模板');return}confirmModal('删除模板？','删除模板不会删除使用过它的旧日记；旧日记保留原字段结构。',()=>{data.templates=data.templates.filter(x=>x.id!==tid);if(t.isDefault)data.templates[0].isDefault=true;persist();render();toast('模板已删除')},'删除模板')}
function renderFinanceHome(){const t=todayISO(),month=t.slice(0,7);const tx=data.transactions.filter(x=>x.dateTime.slice(0,7)===month);const income=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense=tx.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);const todayTx=data.transactions.filter(x=>x.dateTime.slice(0,10)===t).sort((a,b)=>b.dateTime.localeCompare(a.dateTime));const weekStart=new Date();weekStart.setDate(weekStart.getDate()-6);const weekly=data.transactions.filter(x=>new Date(x.dateTime)>=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate())).sort((a,b)=>b.dateTime.localeCompare(a.dateTime));return `${pageHead('MONEY, SIMPLY','记账','${month} · 看清每一笔流向'.replace('${month}',month),`<button class="icon-btn" title="借款提醒" onclick="navigate('debts')">↔</button>`)}<div class="content"><div class="stat-grid"><div class="stat"><div class="stat-label">本月收入</div><div class="stat-value green">${money(income)}</div></div><div class="stat"><div class="stat-label">本月支出</div><div class="stat-value red">${money(expense)}</div></div><div class="stat"><div class="stat-label">本月结余</div><div class="stat-value">${money(income-expense)}</div></div></div><section class="card"><div class="card-title">快速入口</div><div class="row" style="margin-top:13px"><button class="btn block" onclick="openTransactionForm('expense')">－ 记支出</button><button class="btn secondary block" onclick="openTransactionForm('income')">＋ 记收入</button></div><div class="row" style="margin-top:9px"><button class="btn ghost block" onclick="openTransactionForm('borrow')">↙ 借入</button><button class="btn ghost block" onclick="openTransactionForm('lend')">↗ 借出</button></div><div class="divider"></div><div class="row between"><button class="link-btn" onclick="navigate('stats')">查看统计 ↗</button><div class="row"><button class="link-btn" onclick="navigate('categories')">分类</button><span class="muted">·</span><button class="link-btn" onclick="navigate('accounts')">账户</button><span class="muted">·</span><button class="link-btn" onclick="navigate('debts')">借款</button></div></div></section><section class="card"><div class="card-title">今日流水 <span class="pill gray">${todayTx.length} 笔</span></div>${todayTx.length?todayTx.map(transactionRow).join(''):`<div class="empty" style="padding:25px 5px"><strong>今天还没有流水</strong><span class="small">记录一笔，让账目保持清楚。</span></div>`}</section><section class="card"><div class="card-title">最近 7 天 <button class="link-btn" onclick="navigate('stats')">统计详情 ↗</button></div>${weekly.length?weekly.slice(0,5).map(transactionRow).join(''):'<p class="small muted">最近七天还没有普通收支记录。</p>'}<p class="tiny muted" style="margin-bottom:0">借入和借出只作为独立提醒，不计入收入、支出或结余。</p></section></div><button class="fab" onclick="openTransactionForm()">＋ 记一笔</button>`}
function transactionRow(x){const c=data.categories.find(c=>c.id===x.categoryId);const isIn=x.type==='income',isDebt=['borrow','lend'].includes(x.type);const typ={income:'收入',expense:'支出',borrow:'借入提醒',lend:'借出提醒'}[x.type];return `<div class="line-item"><div class="avatar">${isDebt?(x.type==='borrow'?'↙':'↗'):(c?.icon||(isIn?'＋':'−'))}</div><div class="line-body"><div class="line-title">${escapeHTML(x.note||c?.name||typ)} <span class="pill ${isDebt?'orange':'gray'}">${typ}</span></div><div class="line-sub">${x.dateTime.replace('T',' ')}${x.accountId?' · '+escapeHTML(data.accounts.find(a=>a.id===x.accountId)?.name||x.accountName||'账户'):''}</div></div><div class="amount ${isIn?'income':isDebt?'borrow':'expense'}">${isIn?'+':x.type==='expense'?'-':''}${money(x.amount)}</div><button class="mini-action" onclick="openTransactionForm(null,'${x.id}')">···</button></div>`}
function openTransactionForm(type='expense',tid=null){state.editingTransaction=tid?data.transactions.find(x=>x.id===tid):null;state.financeType=type||state.editingTransaction?.type||'expense';state.page='transactionEditor';render()}
function renderTransactionEditor(){const x=state.editingTransaction;const typ=x?.type||state.financeType||'expense';const dt=x?.dateTime||`${todayISO()}T${new Date().toTimeString().slice(0,5)}`;const isDebt=['borrow','lend'].includes(typ);return `${pageHead('NEW RECORD',x?'编辑记录':'记一笔','普通收支与借款提醒分开计算')}<div class="content"><section class="card"><div class="field"><label>记录类型</label><div class="segmented">${[['expense','支出'],['income','收入'],['borrow','借入'],['lend','借出']].map(([v,l])=>`<button class="${typ===v?'active':''}" onclick="state.financeType='${v}';state.editingTransaction=state.editingTransaction?{...state.editingTransaction,type:'${v}'}:null;render()">${l}</button>`).join('')}</div></div><div class="field" style="margin-top:15px"><label>金额（元）</label><input class="input" id="txAmount" inputmode="decimal" type="number" min="0.01" step="0.01" value="${x?(x.amount/100):''}" placeholder="0.00" /></div>${isDebt?`<div class="field" style="margin-top:13px"><label>对方称呼</label><input class="input" id="txPerson" value="${escapeHTML(x?.person||'')}" placeholder="例如：A、朋友姓名" /></div><div class="field-grid" style="margin-top:13px"><div class="field"><label>发生日期</label><input class="input" type="date" id="txDate" value="${dt.slice(0,10)}" /></div><div class="field"><label>到期日期（选填）</label><input class="input" type="date" id="txDue" value="${escapeHTML(x?.dueDate||'')}" /></div></div><p class="small muted" style="line-height:1.6">借入和借出只做提醒，不计入收入支出，不影响账户余额。</p>`:`<div class="field-grid" style="margin-top:13px"><div class="field"><label>分类</label><select class="select" id="txCategory">${data.categories.filter(c=>c.active&&c.type===typ).map(c=>`<option value="${c.id}" ${(x?.categoryId===c.id)?'selected':''}>${escapeHTML(c.icon+' '+c.name)}</option>`).join('')}</select></div><div class="field"><label>账户（选填）</label><select class="select" id="txAccount"><option value="">不指定</option>${data.accounts.filter(a=>a.active).map(a=>`<option value="${a.id}" ${x?.accountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('')}</select></div></div><div class="field" style="margin-top:13px"><label>日期与时间</label><input class="input" type="datetime-local" id="txDateTime" value="${dt}" /></div>`}<div class="field" style="margin-top:13px"><label>备注</label><input class="input" id="txNote" value="${escapeHTML(x?.note||'')}" placeholder="写一点说明（选填）" /></div><div class="modal-actions"><button class="btn ghost" onclick="goBack()">取消</button><button class="btn" onclick="saveTransaction()">保存记录</button></div>${x?`<button class="btn danger block" style="margin-top:9px" onclick="deleteTransaction('${x.id}')">永久删除记录</button>`:''}</section></div>`}
function saveTransaction(){const x=state.editingTransaction,typ=state.financeType;const amt=Number($('#txAmount')?.value);if(!Number.isFinite(amt)||amt<=0){toast('请输入大于 0 的金额');return}const amount=Math.round(amt*100);let item={id:x?.id||id('tx'),type:typ,amount,note:$('#txNote')?.value.trim()||'',createdAt:x?.createdAt||nowISO(),updatedAt:nowISO()};if(['borrow','lend'].includes(typ)){const person=$('#txPerson')?.value.trim();if(!person){toast('请填写对方称呼');return}const date=$('#txDate')?.value||todayISO();item={...item,person,dateTime:date+'T12:00',dueDate:$('#txDue')?.value||'',status:x?.status||'pending',categoryId:null,accountId:null}}else{item={...item,dateTime:$('#txDateTime')?.value||`${todayISO()}T12:00`,categoryId:$('#txCategory')?.value||null,accountId:$('#txAccount')?.value||null,person:'',status:''}}const idx=data.transactions.findIndex(t=>t.id===item.id);if(idx>=0)data.transactions[idx]=item;else data.transactions.push(item);persist();state.editingTransaction=null;state.page='home';render();toast('记录已保存')}
function deleteTransaction(tid){confirmModal('永久删除这条记录？','删除后将无法撤销。',()=>{data.transactions=data.transactions.filter(x=>x.id!==tid);persist();state.editingTransaction=null;state.page='home';render();toast('记录已删除')},'永久删除')}
function renderStats(){const period=state.financePeriod||'month';const now=new Date();let start,end,label;if(period==='day'){start=todayISO();end=start;label=start}else if(period==='week'){const d=new Date(now);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);start=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const e=new Date(d);e.setDate(e.getDate()+6);end=`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`;label=`${start} ~ ${end}`}else if(period==='year'){start=`${now.getFullYear()}-01-01`;end=`${now.getFullYear()}-12-31`;label=String(now.getFullYear())}else{start=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;end=todayISO();label=start.slice(0,7)}const tx=data.transactions.filter(x=>x.type==='income'||x.type==='expense').filter(x=>x.dateTime.slice(0,10)>=start&&x.dateTime.slice(0,10)<=end);const inc=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=tx.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);const expenses=data.categories.filter(c=>c.type==='expense').map(c=>({...c,total:tx.filter(x=>x.type==='expense'&&x.categoryId===c.id).reduce((s,x)=>s+x.amount,0)})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);const total=expenses.reduce((s,c)=>s+c.total,0);return `${pageHead('OVERVIEW','统计与结算',label)}<div class="content"><section class="card"><div class="segmented">${[['day','日'],['week','周'],['month','月'],['year','年']].map(([v,l])=>`<button class="${period===v?'active':''}" onclick="state.financePeriod='${v}';render()">${l}</button>`).join('')}</div><div class="divider"></div><div class="stat-grid"><div class="stat"><div class="stat-label">收入</div><div class="stat-value green">${money(inc)}</div></div><div class="stat"><div class="stat-label">支出</div><div class="stat-value red">${money(exp)}</div></div><div class="stat"><div class="stat-label">结余</div><div class="stat-value">${money(inc-exp)}</div></div></div></section><section class="card"><div class="card-title">支出分类 <span class="tiny muted">占支出总额</span></div>${expenses.length?expenses.map(c=>`<div style="margin-top:16px"><div class="row between"><span class="small">${escapeHTML(c.icon+' '+c.name)}</span><strong class="small">${money(c.total)}</strong></div><div class="progress" style="margin-top:7px"><span style="width:${total?c.total/total*100:0}%"></span></div><div class="tiny muted" style="text-align:right;margin-top:4px">${total?(c.total/total*100).toFixed(1):'0.0'}%</div></div>`).join(''):'<div class="empty"><strong>暂无分类支出</strong><span class="small">这个周期还没有相关数据。</span></div>'}</section><section class="card"><div class="card-title">独立借款提醒</div><div class="row between" style="margin-top:12px"><span class="small muted">待结清借入</span><strong>${money(data.transactions.filter(x=>x.type==='borrow'&&x.status!=='settled').reduce((s,x)=>s+x.amount,0))}</strong></div><div class="row between" style="margin-top:8px"><span class="small muted">待结清借出</span><strong>${money(data.transactions.filter(x=>x.type==='lend'&&x.status!=='settled').reduce((s,x)=>s+x.amount,0))}</strong></div><p class="tiny muted">以上金额不包含在普通收入、支出和结余中。</p></section><button class="btn ghost block" onclick="goBack()">返回记账</button></div>`}
function renderCategories(){return `${pageHead('PREFERENCES','分类管理','每种类型最多 8 个有效分类',`<button class="btn smallbtn" onclick="addCategory()">＋ 添加</button>`)}<div class="content">${['income','expense'].map(type=>`<section class="card"><div class="card-title">${type==='income'?'收入分类':'支出分类'} <span class="pill gray">${data.categories.filter(c=>c.type===type&&c.active).length}/8</span></div>${data.categories.filter(c=>c.type===type).map(c=>`<div class="line-item"><div class="avatar">${escapeHTML(c.icon)}</div><div class="line-body"><div class="line-title">${escapeHTML(c.name)} ${!c.active?'<span class="pill gray">已归档</span>':''}</div></div><button class="btn ghost smallbtn" onclick="editCategory('${c.id}')">编辑</button><button class="mini-action" onclick="categoryActions('${c.id}')">···</button></div>`).join('')||'<p class="small muted">还没有分类。</p>'}</section>`).join('')}<button class="btn ghost block" onclick="goBack()">返回</button></div>`}
function addCategory(){openCategoryModal()};function editCategory(cid){openCategoryModal(data.categories.find(c=>c.id===cid))};function openCategoryModal(c){openModal(c?'编辑分类':'新增分类',`<div class="stack"><div class="field"><label>分类名称</label><input class="input" id="categoryName" value="${escapeHTML(c?.name||'')}" placeholder="例如：餐饮" /></div><div class="field"><label>类型</label><select class="select" id="categoryType" ${c?'disabled':''}><option value="expense" ${c?.type!=='income'?'selected':''}>支出</option><option value="income" ${c?.type==='income'?'selected':''}>收入</option></select></div><div class="field"><label>图标（可选）</label><input class="input" id="categoryIcon" value="${escapeHTML(c?.icon||'◇')}" maxlength="3" /></div><button class="btn block" onclick="saveCategory('${c?.id||''}')">保存分类</button></div>`)}
function saveCategory(cid){const name=$('#categoryName').value.trim(),type=$('#categoryType').value,icon=$('#categoryIcon').value.trim()||'◇';if(!name){toast('请填写分类名称');return}const existing=data.categories.find(c=>c.id===cid);if(!existing&&data.categories.filter(c=>c.type===type&&c.active).length>=8){toast('该类型最多只能有 8 个有效分类');return}if(data.categories.some(c=>c.type===type&&c.name===name&&c.id!==cid)){toast('分类名称已存在');return}if(existing){existing.name=name;existing.icon=icon}else data.categories.push({id:id('cat'),name,type,icon,active:true});persist();closeModal();render();toast('分类已保存')}
function categoryActions(cid){const c=data.categories.find(x=>x.id===cid);openModal('分类操作',`<div class="stack"><button class="btn secondary block" onclick="closeModal();editCategory('${cid}')">编辑</button><button class="btn ghost block" onclick="toggleCategory('${cid}')">${c.active?'归档分类':'恢复分类'}</button></div>`)}function toggleCategory(cid){const c=data.categories.find(x=>x.id===cid);if(c)c.active=!c.active;persist();closeModal();render();toast(c.active?'分类已恢复':'分类已归档')}
function renderAccounts(){return `${pageHead('MONEY SOURCES','账户管理','账户余额只根据普通收支计算',`<button class="btn smallbtn" onclick="openAccountModal()">＋ 添加</button>`)}<div class="content"><section class="card">${data.accounts.map(a=>{const bal=a.opening+data.transactions.filter(x=>x.accountId===a.id&&['income','expense'].includes(x.type)).reduce((s,x)=>s+(x.type==='income'?x.amount:-x.amount),0);return `<div class="line-item"><div class="avatar">▣</div><div class="line-body"><div class="line-title">${escapeHTML(a.name)} ${!a.active?'<span class="pill gray">已归档</span>':''}</div><div class="line-sub">期初余额 ${money(a.opening)} · ${data.transactions.filter(x=>x.accountId===a.id).length} 笔流水</div></div><div class="amount">${money(bal)}</div><button class="mini-action" onclick="accountActions('${a.id}')">···</button></div>`}).join('')||'<div class="empty">暂无账户</div>'}</section><div class="card"><div class="card-title">计算说明</div><p class="small muted" style="line-height:1.8;margin-bottom:0">账户余额 = 期初余额 + 关联收入 − 关联支出。借入和借出是独立提醒，不会自动改变账户余额。无账户的流水仍计入整体收支。</p></div><button class="btn ghost block" onclick="goBack()">返回记账</button></div>`}
function openAccountModal(a=null){openModal(a?'编辑账户':'新增账户',`<div class="stack"><div class="field"><label>账户名称</label><input class="input" id="accountName" value="${escapeHTML(a?.name||'')}" placeholder="例如：日常账户" /></div><div class="field"><label>期初余额（元）</label><input class="input" id="accountOpening" type="number" step="0.01" value="${a?(a.opening/100):'0'}" /></div><button class="btn block" onclick="saveAccount('${a?.id||''}')">保存账户</button></div>`)}function saveAccount(aid){const name=$('#accountName').value.trim(),amount=Number($('#accountOpening').value||0);if(!name||!Number.isFinite(amount)){toast('请检查账户名称和期初余额');return}const a=data.accounts.find(x=>x.id===aid);if(a){a.name=name;a.opening=Math.round(amount*100)}else data.accounts.push({id:id('account'),name,opening:Math.round(amount*100),active:true});persist();closeModal();render();toast('账户已保存')}
function accountActions(aid){const a=data.accounts.find(x=>x.id===aid),refs=data.transactions.some(x=>x.accountId===aid);openModal('账户操作',`<div class="stack"><button class="btn secondary block" onclick="closeModal();openAccountModal(data.accounts.find(x=>x.id==='${aid}'))">编辑账户</button><button class="btn ghost block" onclick="toggleAccount('${aid}')">${a.active?'归档账户':'恢复账户'}</button>${!refs?`<button class="btn danger block" onclick="closeModal();deleteAccount('${aid}')">删除账户</button>`:''}</div>`)}function toggleAccount(aid){const a=data.accounts.find(x=>x.id===aid);a.active=!a.active;persist();closeModal();render();toast(a.active?'账户已恢复':'账户已归档')};function deleteAccount(aid){confirmModal('删除账户？','账户没有关联流水，可以删除。',()=>{data.accounts=data.accounts.filter(x=>x.id!==aid);persist();render();toast('账户已删除')},'删除账户')}
function renderDebts(){const debts=data.transactions.filter(x=>['borrow','lend'].includes(x.type)).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));const br=debts.filter(x=>x.type==='borrow'),le=debts.filter(x=>x.type==='lend');return `${pageHead('REMINDERS','借入 · 借出','只提醒，不纳入收支',`<button class="btn smallbtn" onclick="openTransactionForm('borrow')">＋ 记一笔</button>`)}<div class="content"><div class="stat-grid"><div class="stat"><div class="stat-label">待结清借入</div><div class="stat-value">${money(br.filter(x=>x.status!=='settled').reduce((s,x)=>s+x.amount,0))}</div></div><div class="stat"><div class="stat-label">待结清借出</div><div class="stat-value">${money(le.filter(x=>x.status!=='settled').reduce((s,x)=>s+x.amount,0))}</div></div><div class="stat"><div class="stat-label">记录总数</div><div class="stat-value">${debts.length}</div></div></div><div class="segmented"><button class="active" id="debtTabBorrow" onclick="setDebtTab('borrow')">借入 ${br.length}</button><button id="debtTabLend" onclick="setDebtTab('lend')">借出 ${le.length}</button></div><div id="debtList" class="card">${debtListHTML(br)}</div><div class="card"><div class="card-title">提醒规则</div><p class="small muted" style="line-height:1.8;margin-bottom:0">到期日用于视觉提示，不会自动推送系统通知。借款状态与普通收支流水相互独立。</p></div><button class="btn ghost block" onclick="goBack()">返回记账</button></div>`}
function debtListHTML(list){if(!list.length)return '<div class="empty"><strong>暂无提醒</strong><span class="small">你可以单独记录借入或借出事项。</span></div>';return list.map(x=>`<div class="line-item"><div class="avatar">${x.type==='borrow'?'↙':'↗'}</div><div class="line-body"><div class="line-title">${escapeHTML(x.person)} <span class="pill ${x.status==='settled'?'gray':'orange'}">${x.status==='settled'?'已结清':x.type==='borrow'?'借入':'借出'}</span></div><div class="line-sub">发生 ${x.dateTime.slice(0,10)}${x.dueDate?' · 到期 '+x.dueDate:''}</div>${x.note?`<div class="line-sub">${escapeHTML(x.note)}</div>`:''}</div><div class="stack" style="align-items:end;gap:5px"><div class="amount">${money(x.amount)}</div>${x.status!=='settled'?`<button class="link-btn" onclick="settleDebt('${x.id}')">结清</button>`:'<span class="tiny muted">已完成</span>'}<button class="mini-action" onclick="openTransactionForm(null,'${x.id}')">编辑 ···</button></div></div>`).join('')}
function setDebtTab(type){$('#debtTabBorrow').classList.toggle('active',type==='borrow');$('#debtTabLend').classList.toggle('active',type==='lend');$('#debtList').innerHTML=debtListHTML(data.transactions.filter(x=>x.type===type).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')))}function settleDebt(tid){const x=data.transactions.find(x=>x.id===tid);if(!x)return;confirmModal('标记为已结清？','只更新提醒状态，不生成收入或支出流水。',()=>{x.status='settled';x.updatedAt=nowISO();persist();render();toast('已标记结清')},'确认结清')}
function renderInspirationHome(){const list=[...data.inspirations].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `${pageHead('QUICK THOUGHTS','灵感','随手记下，不必整理') }<div class="content"><section class="card" style="background:var(--accent-soft);border-color:transparent"><div class="row"><div class="avatar" style="background:var(--surface)">✳</div><div><div class="card-title">给自己发一条消息</div><div class="small muted" style="margin-top:4px">一个想法、一句话，先记下来再说。</div></div></div></section><div class="stack" id="inspirationList">${list.length?list.map(inspirationBubble).join(''):`<div class="empty card"><div class="empty-icon">✳</div><strong>灵感还没有来过</strong><span class="small">在下方写下第一个念头。</span></div>`}</div><div class="card" style="position:sticky;bottom:90px"><div class="chat-input"><textarea class="input" id="inspirationInput" rows="1" placeholder="刚刚想到……" style="resize:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInspiration()}"></textarea><button class="btn" style="height:46px" onclick="sendInspiration()">发送 ↗</button></div><div class="tiny muted" style="margin-top:7px">Enter 发送 · Shift + Enter 换行</div></div></div>`}
function inspirationBubble(x){const date=x.createdAt?new Date(x.createdAt):new Date();const today=todayISO(),prev=new Date();prev.setDate(prev.getDate()-1);const p=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;const d=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;const tm=date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const label=d===today?tm:d===p?`昨天 ${tm}`:`${d.slice(5)} ${tm}`;return `<div><div class="chat-row ownrow"><div><div class="bubble own">${escapeHTML(x.content).replace(/\n/g,'<br>')}</div><div class="chat-time" style="text-align:right">${label}</div><div class="chat-menu" style="justify-content:flex-end"><button class="link-btn" onclick="editInspiration('${x.id}')">编辑</button><button class="link-btn" style="color:var(--danger)" onclick="deleteInspiration('${x.id}')">删除</button></div></div><div class="avatar" style="width:31px;height:31px;font-size:14px;border-radius:11px">✳</div></div></div>`}
function sendInspiration(){const el=$('#inspirationInput');const value=el?.value.trim();if(!value){toast('先写一点内容再发送');return}data.inspirations.push({id:id('idea'),content:value,createdAt:nowISO(),updatedAt:nowISO()});persist();render();toast('灵感已保存')}
function editInspiration(iid){const x=data.inspirations.find(x=>x.id===iid);if(!x)return;openModal('编辑灵感',`<div class="field"><label>内容</label><textarea class="textarea" id="editIdeaText">${escapeHTML(x.content)}</textarea></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveInspiration('${iid}')">保存修改</button></div>`)}function saveInspiration(iid){const x=data.inspirations.find(x=>x.id===iid),v=$('#editIdeaText').value.trim();if(!v){toast('内容不能为空');return}x.content=v;x.updatedAt=nowISO();persist();closeModal();render();toast('灵感已更新')}
function deleteInspiration(iid){confirmModal('永久删除这条灵感？','删除后无法撤销，也不会包含在备份中。',()=>{data.inspirations=data.inspirations.filter(x=>x.id!==iid);persist();render();toast('灵感已永久删除')},'永久删除')}
function openInspirationSearch(){state.page='search';render()}
function renderInspirationSearch(){const q=state.inspirationQuery.toLocaleLowerCase().trim();const list=data.inspirations.filter(x=>(!state.inspirationFrom||x.createdAt.slice(0,10)>=state.inspirationFrom)&&(!state.inspirationTo||x.createdAt.slice(0,10)<=state.inspirationTo)&&(!q||x.content.toLocaleLowerCase().includes(q))).sort((a,b)=>state.inspirationSort==='desc'?b.createdAt.localeCompare(a.createdAt):a.createdAt.localeCompare(b.createdAt));return `${pageHead('FIND A THOUGHT','搜索灵感','按关键词和日期筛选')}<div class="content"><section class="card"><div class="field"><label>关键词</label><input class="input" value="${escapeHTML(state.inspirationQuery)}" oninput="state.inspirationQuery=this.value;renderInspirationSearchResults()" placeholder="搜索灵感内容" /></div><div class="field-grid" style="margin-top:12px"><div class="field"><label>开始日期</label><input class="input" type="date" value="${state.inspirationFrom}" onchange="state.inspirationFrom=this.value;renderInspirationSearchResults()" /></div><div class="field"><label>结束日期</label><input class="input" type="date" value="${state.inspirationTo}" onchange="state.inspirationTo=this.value;renderInspirationSearchResults()" /></div></div><div class="row between" style="margin-top:12px"><button class="link-btn" onclick="state.inspirationQuery='';state.inspirationFrom='';state.inspirationTo='';render()">清空条件</button><select class="select" style="width:auto;padding:8px" onchange="state.inspirationSort=this.value;renderInspirationSearchResults()"><option value="desc">从新到旧</option><option value="asc" ${state.inspirationSort==='asc'?'selected':''}>从旧到新</option></select></div></section><section class="card" id="ideaSearchResults">${inspirationSearchHTML(list)}</section></div>`}
function inspirationSearchHTML(list){return list.length?list.map(x=>`<div class="line-item"><div class="avatar">✳</div><div class="line-body"><div class="line-title">${escapeHTML(x.content)}</div><div class="line-sub">${x.createdAt.slice(0,16).replace('T',' ')}</div></div><button class="link-btn" onclick="editInspiration('${x.id}')">编辑</button></div>`).join(''):'<div class="empty"><strong>无结果</strong><span class="small">试试其他关键词或日期范围。</span></div>'}
function renderInspirationSearchResults(){const root=$('#ideaSearchResults');if(!root)return;const q=state.inspirationQuery.trim().toLocaleLowerCase();const list=data.inspirations.filter(x=>(!state.inspirationFrom||x.createdAt.slice(0,10)>=state.inspirationFrom)&&(!state.inspirationTo||x.createdAt.slice(0,10)<=state.inspirationTo)&&(!q||x.content.toLocaleLowerCase().includes(q))).sort((a,b)=>state.inspirationSort==='desc'?b.createdAt.localeCompare(a.createdAt):a.createdAt.localeCompare(b.createdAt));root.innerHTML=inspirationSearchHTML(list)}
function renderSettings(){const s=data.settings;let backupAge='尚未备份';if(s.lastBackup){const days=Math.max(0,Math.floor((Date.now()-new Date(s.lastBackup).getTime())/86400000));backupAge=`${days} 天前备份`};return `${pageHead('YOUR SPACE','设置','简单、可控，数据由你掌握')}<div class="content"><section class="card"><div class="card-title">外观</div><div class="setting-row"><div class="setting-ico">☼</div><div class="setting-main"><strong>显示主题</strong><span>跟随系统、浅色或深色</span></div></div><div class="segmented" style="margin-top:13px">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([v,l])=>`<button class="${s.theme===v?'active':''}" onclick="setTheme('${v}')">${l}</button>`).join('')}</div></section><section class="card"><div class="card-title">数据与备份 <span class="pill">仅手动</span></div><div class="setting-row"><div class="setting-ico">⇧</div><div class="setting-main"><strong>完整数据备份</strong><span>导出 JSON 备份，可用于恢复日记、模板、账目与灵感</span></div><button class="btn secondary smallbtn" onclick="exportBackup()">备份</button></div><div class="setting-row"><div class="setting-ico">⇩</div><div class="setting-main"><strong>恢复完整备份</strong><span>选择之前导出的备份文件；恢复前会再次确认</span></div><button class="btn ghost smallbtn" onclick="document.getElementById('restoreFile').click()">恢复</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden onchange="restoreBackupFile(this.files[0]);this.value=''"/><div class="setting-row"><div class="setting-ico">▤</div><div class="setting-main"><strong>导出日记 Markdown</strong><span>便于阅读和长期归档，不包含已删除内容</span></div><button class="btn ghost smallbtn" onclick="exportAllMarkdown()">导出</button></div><div class="divider"></div><div class="row between"><div><div class="small muted">上次完整备份</div><strong style="font-size:13px">${s.lastBackup?new Date(s.lastBackup).toLocaleString('zh-CN'):'暂无记录'}</strong></div><span class="pill ${s.lastBackup?'gray':'orange'}">${backupAge}</span></div><p class="tiny muted" style="line-height:1.7;margin-bottom:0">原型数据保存于浏览器本地存储。原生 App 将使用 Room，并通过系统文件选择器保存备份。</p></section><section class="card"><div class="card-title">AI 辅助 <span class="pill gray">V2 · 可选</span></div><div class="setting-row"><div class="setting-ico">✧</div><div class="setting-main"><strong>AI 配置</strong><span>默认关闭；可配置本地模型或云端 API</span></div><button class="btn secondary smallbtn" onclick="navigate('ai')">设置</button></div><div class="row between" style="margin-top:12px"><span class="small muted">当前模式</span><span class="pill ${s.aiMode==='off'?'gray':''}">${{off:'已关闭',local:'本地模型',cloud:'云端 API'}[s.aiMode]}</span></div></section><section class="card"><div class="card-title">隐私原则</div>${[['本地存储','基础功能不需要网络'],['不自动备份','只有你主动点击才导出'],['AI 可关闭','关闭后不发起 AI 请求'],['永久删除','确认后从本地数据中移除']].map(([a,b])=>`<div class="setting-row"><div class="setting-ico">✓</div><div class="setting-main"><strong>${a}</strong><span>${b}</span></div></div>`).join('')}</section><section class="card"><div class="card-title">应用信息</div><div class="row between" style="margin-top:12px"><span class="small muted">版本</span><span class="small">UI 原型 · V1 + V2</span></div><div class="row between" style="margin-top:9px"><span class="small muted">数据存储</span><span class="small">浏览器 LocalStorage（演示）</span></div><button class="btn ghost block" style="margin-top:13px" onclick="showAbout()">关于与使用说明</button></section></div>`}
function setTheme(t){data.settings.theme=t;persist();applyTheme();render();toast('主题已更新')};function applyTheme(){const t=data.settings.theme;const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark)}
function renderAISettings(){const s=data.settings;return `${pageHead('OPTIONAL INTELLIGENCE','AI 配置','默认关闭，按需启用')}<div class="content"><section class="card"><div class="card-title">运行模式</div><div class="segmented" style="margin-top:12px">${[['off','关闭'],['local','本地模型'],['cloud','云端 API']].map(([v,l])=>`<button class="${s.aiMode===v?'active':''}" onclick="setAIMode('${v}')">${l}</button>`).join('')}</div><p class="small muted" style="line-height:1.7;margin-bottom:0">${s.aiMode==='off'?'AI 已关闭，不会发起模型请求。日记、记账和灵感照常使用。':s.aiMode==='local'?'本地模式通过你配置的地址访问模型。请确认该地址属于你信任的设备或服务。':'云端模式会将你主动选择的内容发送给所配置的第三方服务，发送前应确认本次内容。'}</p></section>${s.aiMode==='off'?`<section class="card"><div class="empty" style="padding:18px"><div class="empty-icon">✧</div><strong>AI 暂时休息中</strong><span class="small">切换到本地模型或云端 API 后，可配置连接。</span></div></section>`:`<section class="card"><div class="card-title">连接配置</div>${s.aiMode==='cloud'?`<div class="field" style="margin-top:13px"><label>提供商</label><select class="select" id="aiProvider"><option ${s.aiProvider==='OpenAI 兼容接口'?'selected':''}>OpenAI 兼容接口</option><option ${s.aiProvider==='DeepSeek'?'selected':''}>DeepSeek</option><option ${s.aiProvider==='智谱 GLM'?'selected':''}>智谱 GLM</option><option ${s.aiProvider==='自定义'?'selected':''}>自定义</option></select></div>`:''}<div class="field" style="margin-top:13px"><label>Base URL</label><input class="input" id="aiUrl" value="${escapeHTML(s.baseUrl)}" placeholder="https://... 或 http://局域网地址:端口" /></div><div class="field" style="margin-top:13px"><label>模型名称</label><input class="input" id="aiModel" value="${escapeHTML(s.model)}" placeholder="填写模型名称" /></div>${s.aiMode==='cloud'?`<div class="field" style="margin-top:13px"><label>API Key</label><input class="input" id="aiKey" type="password" value="${escapeHTML(s.apiKey)}" placeholder="仅原型演示，不建议填写真实密钥" /><div class="hint">注意：HTML 原型无法提供 Android Keystore 级别的密钥保护，请勿填写真实 API Key。</div></div>`:''}<div class="field" style="margin-top:13px"><label>请求超时（秒）</label><input class="input" type="number" id="aiTimeout" min="5" max="180" value="${Number(s.timeout||30)}" /></div><div class="modal-actions"><button class="btn ghost" onclick="saveAISettings()">保存配置</button><button class="btn" onclick="testAIConnection()">测试连接</button></div></section><section class="card"><div class="card-title">可用功能</div><div class="setting-row"><div class="setting-ico">✧</div><div class="setting-main"><strong>日记润色</strong><span>仅修正错字和不通顺句子，采纳前展示结果</span></div><button class="link-btn" onclick="switchTab('diary');openToday()">试用 ↗</button></div><div class="setting-row"><div class="setting-ico">☷</div><div class="setting-main"><strong>一天总结</strong><span>生成 100 字以内摘要，由你决定是否保存</span></div></div><div class="setting-row"><div class="setting-ico">↗</div><div class="setting-main"><strong>七天建议</strong><span>基于用户主动选择的摘要和收支概览</span></div><button class="link-btn" onclick="runAI('advice')">生成示例</button></div></section>`}<button class="btn ghost block" onclick="goBack()">返回设置</button></div>`}
function setAIMode(m){data.settings.aiMode=m;persist();render();toast(m==='off'?'AI 已关闭':'已切换 AI 模式')}
function saveAISettings(){const s=data.settings;s.baseUrl=$('#aiUrl')?.value.trim()||'';s.model=$('#aiModel')?.value.trim()||'';s.timeout=Math.max(5,Math.min(180,Number($('#aiTimeout')?.value||30)));if($('#aiProvider'))s.aiProvider=$('#aiProvider').value;if($('#aiKey'))s.apiKey=$('#aiKey').value;persist();toast('配置已保存在当前原型浏览器中');render()}
function testAIConnection(){saveAISettings();const s=data.settings;if(!s.baseUrl||!s.model){toast('请先填写 Base URL 和模型名称');return}openModal('连接测试（原型）',`<div class="stack"><div class="pill orange">模拟测试 · 未发起网络请求</div><p class="small" style="line-height:1.8">当前 HTML 原型不会真的请求 AI 服务。原生 V2 需要通过 OkHttp 发起请求，并处理鉴权、超时、取消和响应解析。</p><div class="field"><label>Base URL</label><div class="input" style="overflow-wrap:anywhere">${escapeHTML(s.baseUrl)}</div></div><div class="field"><label>模型</label><div class="input">${escapeHTML(s.model)}</div></div><button class="btn block" onclick="closeModal();toast('原型已记录测试意图；未进行网络连接')">知道了</button></div>`)}
function runAI(kind,did){if(data.settings.aiMode==='off'){openModal('AI 尚未开启',`<p class="small muted" style="line-height:1.8">AI 默认关闭。你可以先在设置中配置本地模型或云端 API。当前原型将使用示例内容演示界面，不会向任何服务发送数据。</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="closeModal();switchTab('settings');navigate('ai')">前往 AI 配置</button></div>`);return}let original='',result='',title='AI 结果';if(kind==='advice'){title='七天建议';original='最近 7 天摘要（演示）\n记录了日常生活与若干笔普通收支。';result='1. 给每天留出 10 分钟整理思绪。\n2. 回顾一周里最常出现的支出分类，看看是否符合预期。\n3. 将一个反复出现的想法拆成下一步可执行的小任务。'}else{const d=data.diaries.find(x=>x.id===did);original=d?d.fields.map(f=>`## ${f.label}\n${f.content}`).join('\n\n'):'';result=kind==='polish'?original.replace(/非常非常/g,'很').replace(/然后然后/g,'然后'):(diaryExcerpt(d)||'今天还没有填写内容。').slice(0,100);title=kind==='polish'?'AI 润色':'一天总结'}if(!original.trim()&&kind!=='advice'){toast('请先写一点日记内容');return}state.aiDraft={kind,did,original,result,title};openModal(title,`<div class="pill orange" style="margin-bottom:12px">演示结果 · 未连接模型</div><div class="result-grid"><div class="result-panel"><h4>原始内容</h4><p>${escapeHTML(original||'（没有原始内容）')}</p></div><div class="result-panel"><h4>示例结果</h4><p>${escapeHTML(result)}</p></div></div><p class="tiny muted" style="line-height:1.7">这是用于确认交互的模拟结果，不是真正的 AI 输出。正式版本将由模型生成，采纳前可检查内容。</p><div class="modal-actions"><button class="btn ghost" onclick="copyAIResult()">复制</button><button class="btn ghost" onclick="closeModal()">丢弃</button><button class="btn" onclick="adoptAIResult()">采纳</button></div>`)}
function adoptAIResult(){const a=state.aiDraft;if(!a){closeModal();return}if(a.did&&a.kind==='polish'){const d=data.diaries.find(x=>x.id===a.did);if(d){d.aiOriginalSnapshot=d.fields.map(f=>({...f}));const first=d.fields.find(f=>f.type==='multi')||d.fields[0];if(first)first.content=a.result;d.updatedAt=nowISO();persist();toast('示例结果已采纳，原内容已留存快照')}}else if(a.did&&a.kind==='summary'){const d=data.diaries.find(x=>x.id===a.did);if(d){d.fields.push({id:id('ai'),label:'AI 摘要（演示）',type:'multi',required:false,content:a.result});persist();toast('示例摘要已保存')}}else{data.aiNotes=data.aiNotes||[];data.aiNotes.push({id:id('ainote'),title:a.title,content:a.result,createdAt:nowISO()});persist();toast('示例结果已保存到独立 AI 记录')}closeModal();if(a.did){state.tab='diary';state.page='editor';render()} }
function copyAIResult(){if(!state.aiDraft)return;const text=state.aiDraft.result;navigator.clipboard?.writeText(text).then(()=>toast('已复制结果')).catch(()=>{openModal('复制结果',`<textarea class="textarea" id="copyFallback">${escapeHTML(text)}</textarea><button class="btn block" style="margin-top:10px" onclick="$('#copyFallback').select();document.execCommand('copy');toast('已尝试复制');closeModal()">选择并复制</button>`)})}

function downloadFile(filename,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){const payload={format:'shiy e-local-backup',formatVersion:1,appVersion:'UI-prototype-v1',exportedAt:nowISO(),data:{...data,settings:{...data.settings,apiKey:''}}};downloadFile(`shiye-backup-${todayISO()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');data.settings.lastBackup=nowISO();persist();render();toast('完整备份文件已生成（原型 JSON 格式）')}
function restoreBackupFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.format!=='shiy e-local-backup'||obj.formatVersion!==1||!obj.data||!Array.isArray(obj.data.diaries)||!Array.isArray(obj.data.templates))throw new Error('格式或版本不正确');openModal('确认恢复备份',`<div class="pill orange">将替换当前原型数据</div><p class="small" style="line-height:1.8">备份时间：${escapeHTML(obj.exportedAt||'未知')}<br>日记：${obj.data.diaries.length} 篇<br>模板：${obj.data.templates.length} 个<br>普通流水与借款提醒：${obj.data.transactions?.length||0} 条<br>灵感：${obj.data.inspirations?.length||0} 条</p><p class="small muted">恢复前请确保已导出现有数据。此操作会覆盖当前浏览器原型中的数据。</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn danger" onclick="applyRestore(window.__restorePayload)">确认恢复</button></div>`);window.__restorePayload=obj}catch(e){toast('备份文件无效或不受支持：'+e.message)}};reader.readAsText(file)}
function applyRestore(obj){if(!obj?.data){toast('备份内容无效');return}data=obj.data;for(const k in defaults)if(data[k]===undefined)data[k]=defaults[k];data.settings={...defaults.settings,...(data.settings||{}),apiKey:''};persist();closeModal();state={...state,tab:'diary',page:'home',activeDiary:null};applyTheme();render();toast('原型数据已恢复')}
function diaryToMarkdown(d){return `---\ndate: ${d.date}\ntemplate: ${JSON.stringify(d.templateName||'日记')}\ntemplate_version: ${d.templateVersion||1}\n---\n\n`+d.fields.map(f=>`## ${f.label}\n\n${f.content||''}`).join('\n\n')+'\n'}
function exportOneDiary(did){const d=data.diaries.find(x=>x.id===did);if(!d)return;downloadFile(`${d.date}.md`,diaryToMarkdown(d));toast('Markdown 文件已生成')}
function exportAllMarkdown(){const diaries=[...data.diaries].sort((a,b)=>a.date.localeCompare(b.date));if(!diaries.length){toast('没有可导出的日记');return}downloadFile(`shiye-diaries-${todayISO()}.md`,diaries.map(d=>`# ${d.date}\n\n${diaryToMarkdown(d)}`).join('\n---\n\n'));toast('日记 Markdown 已导出')}
function showAbout(){openModal('关于拾页',`<div class="stack"><p class="small" style="line-height:1.8">拾页是一款本地优先的个人日记工具。这个文件是用于查看所有版本界面和基础流程的 HTML 原型。</p><div class="setting-row"><div class="setting-ico">⌂</div><div class="setting-main"><strong>当前原型数据</strong><span>保存在浏览器 LocalStorage，不等同于 Android Room 数据库。</span></div></div><div class="setting-row"><div class="setting-ico">⇧</div><div class="setting-main"><strong>备份格式</strong><span>原型使用 JSON 文件模拟完整备份；原生应用会实现版本化结构化备份与恢复。</span></div></div><button class="btn block" onclick="closeModal()">明白了</button></div>`)}
function confirmModal(title,body,onConfirm,confirmLabel='确认'){openModal(title,`<p class="small" style="line-height:1.8">${body}</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn danger" id="confirmDo">${confirmLabel}</button></div>`);$('#confirmDo').onclick=()=>{closeModal();onConfirm()}}
function openModal(title,html){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="modal-title">${title}</div><button class="modal-close" onclick="closeModal()">×</button></div>${html}</div></div>`;document.body.style.overflow='hidden'}function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow=''}
function attachDynamicHandlers(){if(state.page==='editor'){$$('.diary-field').forEach(el=>el.addEventListener('input',()=>updateDiaryField(state.activeDiary,el.dataset.fid,el.value)))}if(state.page==='home'&&state.tab==='inspiration'){const inp=$('#inspirationInput');if(inp){inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'})}}}
// Apply theme and initialize the first screen. Prototype uses browser storage only.
applyTheme();render();
window.addEventListener('beforeunload',()=>{if(state.activeDiary){const d=data.diaries.find(x=>x.id===state.activeDiary);if(d)persist()}});
</script>
</body>
</html>
